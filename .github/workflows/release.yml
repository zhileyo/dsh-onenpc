name: Release

# 推 main 就跑：自测 → 版本没发过就发 npm → 自动打 tag + 建 Release。
# 版本已存在时什么都不做（所以「忘了改版本号」的提交不会重复发布）。
#
# 开关：仓库变量 NPM_PUBLISH=1 才真正发布；没设时只跑自测与打包。
# 这样在 npm 信任关系还没绑好之前，push 不会把 CI 跑成红色。
#
# 认证走 npm Trusted Publishing（OIDC），仓库里没有任何长期 token。
# 一次性准备见 docs/REPO.md「发布」一节。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 建 tag / Release
  id-token: write # npm --provenance 的 OIDC 签名

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: 自测（domain）
        run: npm run check:fast

      - name: 读版本 + 判断是否已发布
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "dsh-onenpc@$v" version >/dev/null 2>&1; then
            echo "registry 上已有 $v"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry 上没有 $v"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包
        if: steps.ver.outputs.exists == 'false'
        run: npm pack

      - name: 发布到 npm
        if: steps.ver.outputs.exists == 'false' && vars.NPM_PUBLISH == '1'
        run: npm publish --provenance --access public

      - name: 打 tag + 建 Release
        if: steps.ver.outputs.exists == 'false' && vars.NPM_PUBLISH == '1'
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" ./dsh-onenpc-*.tgz \
            --target "$GITHUB_SHA" \
            --title "v$v" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 说明本次为何没发布
        if: steps.ver.outputs.exists == 'true' || vars.NPM_PUBLISH != '1'
        run: |
          echo "::notice::版本 ${{ steps.ver.outputs.version }} 已发布，或自动发布未启用（仓库变量 NPM_PUBLISH != 1）。本次只跑自测。"
